[package]
name = "miyu4mac"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Miyu — a terminal AI assistant for macOS"
repository = "https://github.com/Alamanes/Miyu-For-Mac"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
futures-util = "0.3"
